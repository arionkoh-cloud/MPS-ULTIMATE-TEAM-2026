<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS Ultimate Team 2026</title>
    <style>
        :root {
            --primary: #00ffaa;
            --bg: #050508;
            --curve: cubic-bezier(0.19, 1, 0.22, 1);
            --card-oro:    url('https://cdn3.futbin.com/content/fifa26/img/cards/hd/1_gold.png?fm=png&ixlib=java-2.1.0&verzion=5&w=644');
            --card-plata:  url('https://cdn3.futbin.com/content/fifa26/img/cards/hd/1_silver.png?fm=png&ixlib=java-2.1.0&verzion=5&w=644');
            --card-bronce: url('https://cdn3.futbin.com/content/fifa26/img/cards/hd/1_bronze.png?fm=png&ixlib=java-2.1.0&verzion=5&w=644');
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DIN Condensed','Arial Narrow',Arial,sans-serif; background: var(--bg); color: #fff; overflow: hidden; height: 100vh; }

        /* ── TOASTS ─────────────────────────────────────────── */
        #toasts { position: fixed; bottom: 28px; right: 28px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: #1a1a2e; border-left: 4px solid var(--primary);
            color: white; padding: 13px 20px; border-radius: 6px;
            font-size: 0.95rem; font-weight: bold; max-width: 310px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            animation: toastIn 0.4s var(--curve);
        }
        .toast.error   { border-color: #ff3232; }
        .toast.warning { border-color: #f1c40f; }
        @keyframes toastIn { from { transform: translateX(60px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── LOADER ─────────────────────────────────────────── */
        #loader {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 30% 50%, #1a1a2e 0%, var(--bg) 100%);
            display: flex; align-items: center; z-index: 1000;
            padding: 0 10%;
            transition: opacity 0.8s var(--curve), visibility 0.8s;
        }
        #loader.hide { opacity: 0; visibility: hidden; }
        .loader-left { position: relative; flex: 1; z-index: 10; }
        .logo-main { font-size: 8rem; font-weight: 900; font-style: italic; line-height: 1; letter-spacing: -3px; }
        .logo-sub  { color: var(--primary); font-size: 1.8rem; font-weight: bold; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 30px; }

        #auth-form { display: flex; flex-direction: column; gap: 12px; width: 350px; margin-bottom: 20px; }
        .inp {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,170,0.3);
            padding: 13px 16px; color: white; border-radius: 5px; outline: none;
            font-size: 1.1rem; font-family: inherit; letter-spacing: 2px;
            transition: border-color 0.3s, background 0.3s;
        }
        .inp:focus { border-color: var(--primary); background: rgba(255,255,255,0.08); }
        .inp::placeholder { color: rgba(255,255,255,0.3); letter-spacing: 3px; }
        .auth-row { display: flex; gap: 10px; }
        .btn-auth {
            flex: 1; padding: 13px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; border-radius: 5px; transition: 0.3s;
            font-family: inherit; font-size: 1rem; letter-spacing: 1px;
        }
        #btn-login    { background: var(--primary); color: black; border: none; }
        #btn-login:hover { filter: brightness(1.1); }
        #btn-register { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        #btn-register:hover { background: rgba(0,255,170,0.1); }

        .progress-wrap { width: 350px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-bottom: 30px; display: none; }
        .progress-bar  { height: 100%; width: 0%; background: var(--primary); box-shadow: 0 0 15px var(--primary); transition: width 0.5s ease; }

        #btn-enter {
            background: transparent; border: 2px solid var(--primary); color: var(--primary);
            padding: 15px 45px; font-size: 1.8rem; font-style: italic; text-transform: uppercase;
            cursor: pointer; border-radius: 5px; font-family: inherit;
            opacity: 0; transform: translateY(30px); pointer-events: none;
            transition: all 0.5s var(--curve);
        }
        #btn-enter.ready { opacity: 1; transform: translateY(0); pointer-events: auto; animation: glow 1.5s infinite; }
        @keyframes glow { 0%,100% { box-shadow: 0 0 5px var(--primary); } 50% { box-shadow: 0 0 30px var(--primary); opacity: 0.8; } }

        .player-art { position: absolute; left: 16%; bottom: -5%; height: 115vh; z-index: 1; pointer-events: none; }
        .player-art img { height: 100%; filter: drop-shadow(20px 0 60px rgba(0,255,170,0.12)); animation: slideIn 1.8s var(--curve); }
        @keyframes slideIn { from { transform: translateX(-140px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── MAIN CONTENT ───────────────────────────────────── */
        #app { display: flex; flex-direction: column; height: 100vh; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
        #app.on { opacity: 1; pointer-events: auto; }

        header { padding: 28px 60px; display: flex; justify-content: space-between; align-items: center; }
        .user-box { display: flex; align-items: center; gap: 15px; }
        #user-display { font-size: 1.1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        #btn-logout {
            background: rgba(255,50,50,0.14); border: 1px solid rgba(255,50,50,0.5); color: #ff3232;
            padding: 6px 16px; cursor: pointer; font-weight: bold; font-family: inherit;
            text-transform: uppercase; border-radius: 4px; transition: 0.2s; letter-spacing: 1px;
        }
        #btn-logout:hover { background: rgba(255,50,50,0.28); }

        .stats { display: flex; gap: 25px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); padding: 10px 28px; border-radius: 50px; }
        .stat { font-weight: bold; font-size: 1.05rem; letter-spacing: 1px; }

        .main-menu { flex: 1; display: flex; padding: 0 40px 50px; gap: 15px; }
        .menu-tile {
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 15px; padding: 40px; display: flex; flex-direction: column;
            justify-content: flex-end; cursor: pointer; position: relative; overflow: hidden;
            transition: flex 0.6s var(--curve), background 0.3s, border-color 0.3s;
        }
        .menu-tile:hover { flex: 3; background: rgba(255,255,255,0.07); border-color: var(--primary); }
        .menu-tile::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,255,170,0.06) 0%, transparent 60%); opacity: 0; transition: opacity 0.3s; }
        .menu-tile:hover::before { opacity: 1; }
        .menu-tile .icon { font-size: 2.8rem; margin-bottom: 15px; opacity: 0.45; }
        .menu-tile h2 { font-size: 3.2rem; text-transform: uppercase; font-style: italic; line-height: 0.9; white-space: nowrap; }

        /* ── FULL-SCREEN SECTIONS ────────────────────────────── */
        .screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #10101a 0%, var(--bg) 100%);
            z-index: 500; display: none; flex-direction: column;
            padding: 48px 60px 40px; overflow-y: auto;
        }
        .screen.open { display: flex; animation: fadeIn 0.35s var(--curve); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.985); } to { opacity: 1; transform: scale(1); } }

        .sec-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid rgba(0,255,170,0.2); flex-shrink: 0; }
        .sec-title { font-size: 3.5rem; font-style: italic; text-transform: uppercase; }
        .sec-title span { color: var(--primary); }
        .sec-actions { display: flex; gap: 10px; }

        .btn-back  { background: white; color: black; border: none; padding: 10px 22px; font-weight: bold; font-family: inherit; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-back:hover { background: var(--primary); }
        .btn-red   { background: #ff3232; color: white; border: none; padding: 10px 22px; font-weight: bold; font-family: inherit; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .btn-red:hover { filter: brightness(1.2); }

        .sub-title { font-size: 1.7rem; font-style: italic; color: var(--primary); text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 15px; margin-bottom: 22px; }

        /* ── CARDS ─────────────────────────────────────────── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 42px 20px; align-items: start; }
        .card-wrap { display: flex; flex-direction: column; gap: 7px; }

        .card {
            aspect-ratio: 2/3; position: relative; overflow: hidden;
            background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
            color: #3e3e3e; text-align: center;
            transition: transform 0.25s; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .card:hover { transform: translateY(-5px) scale(1.03); z-index: 2; }
        .card.oro     { background-image: var(--card-oro); }
        .card.plata   { background-image: var(--card-plata); }
        .card.bronce  { background-image: var(--card-bronce); }
        .card.especial { background: linear-gradient(135deg, #00ffaa 0%, #0066ff 100%); border-radius: 10px; color: white; }

        .card img  { width: 82%; position: absolute; top: 22%; left: 50%; transform: translateX(-50%); z-index: 0; pointer-events: none; }
        .card .ovr { position: absolute; top: 18%; left: 15%; font-size: 1.6rem; font-weight: 900; z-index: 1; }
        .card .pos { position: absolute; top: 33%; left: 15%; font-size: 0.85rem; font-weight: bold; z-index: 1; }
        .card .name { position: absolute; bottom: 17%; width: 100%; font-weight: 900; text-transform: uppercase; font-size: 0.95rem; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
        
        .card.dim { filter: saturate(0.45); }
        .badge-sale { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-15deg); background: #ff3232; color: white; padding: 5px 14px; font-weight: bold; font-size: 1.1rem; border: 2px solid white; z-index: 15; box-shadow: 0 0 15px rgba(255,50,50,0.5); pointer-events: none; }

        .card-btns { display: flex; flex-direction: column; gap: 5px; }
        .btn-c {
            width: 100%; background: rgba(255,255,255,0.09); color: white;
            border: 1px solid rgba(255,255,255,0.18); padding: 8px; border-radius: 4px;
            cursor: pointer; font-size: 0.72rem; font-weight: bold; font-family: inherit;
            text-transform: uppercase; transition: 0.2s; letter-spacing: 0.5px;
        }
        .btn-c:hover      { background: var(--primary); color: black; border-color: var(--primary); }
        .btn-c.white      { background: rgba(255,255,255,0.88); color: black; }
        .btn-c.white:hover { background: var(--primary); }
        .btn-c.danger:hover { background: #ff3232; border-color: #ff3232; color: white; }
        .seller-tag { font-size: 0.62rem; font-weight: bold; text-transform: uppercase; color: rgba(255,255,255,0.55); text-align: center; }
        .price-tag  { font-weight: bold; color: var(--primary); text-align: center; font-size: 0.9rem; }

        /* ── PACK STORE ─────────────────────────────────────── */
        .packs-row { display: flex; justify-content: center; gap: 30px; padding: 40px 0; flex-wrap: wrap; }
        .pack {
            width: 220px; height: 320px; border-radius: 14px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 22px; text-align: center; position: relative; overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .pack:hover { transform: translateY(-8px) scale(1.04); box-shadow: 0 0 35px rgba(0,255,170,0.35); }
        .pack-bronce { background: linear-gradient(135deg, #1a1a2e, #cd7f32); border: 3px solid #cd7f32; }
        .pack-plata  { background: linear-gradient(135deg, #1a1a2e, #95a5a6); border: 3px solid #95a5a6; }
        .pack-oro    { background: linear-gradient(135deg, #1a1a2e, #f1c40f); border: 3px solid #f1c40f; }
        .pack-name  { font-size: 2rem; font-style: italic; font-weight: 900; margin-bottom: 6px; }
        .pack-range { font-size: 0.88rem; color: rgba(255,255,255,0.65); margin-bottom: 20px; }
        .pack-btns  { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .btn-pack {
            padding: 9px; border-radius: 5px; border: none; font-weight: bold; font-family: inherit;
            cursor: pointer; font-size: 0.9rem; text-transform: uppercase;
            background: rgba(255,255,255,0.15); color: white; transition: 0.2s;
        }
        .btn-pack:hover  { background: var(--primary); color: black; }
        .btn-pack.pts    { background: rgba(0,102,255,0.6); }
        .btn-pack.pts:hover { background: #0066ff; color: white; }

        /* ── PACK REVEAL ─────────────────────────────────────── */
        #reveal {
            position: fixed; inset: 0; z-index: 3000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            transition: background 0.6s ease;
        }
        #reveal.open { display: flex; }
        .walkout { animation: flash 1.8s forwards, riseUp 0.7s var(--curve); }
        @keyframes flash  { 0%{filter:brightness(1) blur(0)} 40%{filter:brightness(6) blur(20px)} 100%{filter:brightness(1) blur(0)} }
        @keyframes riseUp { from{transform:translateY(80px) scale(0.7);opacity:0} to{transform:translateY(0) scale(1.1);opacity:1} }
        #btn-cont {
            margin-top: 42px; background: transparent; border: 2px solid white; color: white;
            padding: 12px 42px; font-size: 1.6rem; font-style: italic; font-family: inherit;
            text-transform: uppercase; cursor: pointer; border-radius: 5px; display: none; transition: 0.2s;
        }
        #btn-cont:hover { background: white; color: black; }

        /* ── MODALS ──────────────────────────────────────────── */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-bg.open { display: flex; }
        .modal-box { background: #12121e; border: 2px solid var(--primary); padding: 35px; border-radius: 16px; text-align: center; width: 340px; box-shadow: 0 0 60px rgba(0,255,170,0.15); animation: slideUp 0.3s var(--curve); }
        .modal-box.red { border-color: #ff3232; }
        @keyframes slideUp { from{transform:translateY(50px);opacity:0} to{transform:translateY(0);opacity:1} }
        .modal-title { font-size: 2rem; font-style: italic; text-transform: uppercase; }
        .modal-body  { color: rgba(255,255,255,0.78); margin: 15px 0; font-size: 1.05rem; line-height: 1.4; }
        .modal-btns  { display: flex; gap: 10px; margin-top: 20px; }
        .btn-m { flex: 1; padding: 12px; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; border-radius: 4px; border: none; transition: 0.2s; font-size: 0.9rem; }
        .btn-m.green  { background: var(--primary); color: black; }
        .btn-m.crimson { background: #ff3232; color: white; }
        .btn-m.grey   { background: rgba(255,255,255,0.1); color: white; }
        .btn-m:hover  { filter: brightness(1.12); }

        #inp-price { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--primary); color: white; padding: 13px; border-radius: 5px; font-size: 1.6rem; font-family: inherit; text-align: center; outline: none; margin-top: 14px; }
        #modal-card { margin: 14px auto; width: 150px; }

        .empty { text-align: center; padding: 60px; color: rgba(255,255,255,0.28); }
        .empty .ico { font-size: 4rem; margin-bottom: 14px; }
        .empty p { font-size: 1.2rem; text-transform: uppercase; font-style: italic; }
    </style>
</head>
<body>

<!-- TOASTS -->
<div id="toasts"></div>

<!-- ══════════════ LOADER / AUTH ══════════════ -->
<div id="loader">
    <div class="loader-left">
        <div class="logo-main">MPS UT</div>
        <div class="logo-sub">Season 2026</div>
        <div id="auth-form">
            <input class="inp" type="text"     id="auth-user" placeholder="USUARIO"    autocomplete="off" autocapitalize="none">
            <input class="inp" type="password" id="auth-pass" placeholder="CONTRASEÑA">
            <div class="auth-row">
                <button class="btn-auth" id="btn-login">ENTRAR</button>
                <button class="btn-auth" id="btn-register">REGISTRAR</button>
            </div>
        </div>
        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <button id="btn-enter" onclick="enterGame()">CLICK PARA EMPEZAR</button>
    </div>
    <div class="player-art">
        <img src="https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/main/assets/lostscout.png?raw=true" alt="">
    </div>
</div>

<!-- ══════════════ MAIN APP ══════════════ -->
<div id="app">
    <header>
        <div class="user-box">
            <div id="user-display">CONECTANDO...</div>
            <button id="btn-logout">CERRAR SESIÓN</button>
        </div>
        <div class="stats">
            <span class="stat" id="s-coins">🪙 –</span>
            <span class="stat" id="s-points">💎 –</span>
        </div>
    </header>
    <main class="main-menu">
        <div class="menu-tile">
            <div class="icon">⚔️</div>
            <h2>DIVISION<br>RIVALS</h2>
        </div>
        <div class="menu-tile" onclick="openScreen('club')">
            <div class="icon">🛡️</div>
            <h2>MI<br>CLUB</h2>
        </div>
        <div class="menu-tile" onclick="openScreen('market')">
            <div class="icon">🏦</div>
            <h2>MERCADO DE<br>FICHAJES</h2>
        </div>
        <div class="menu-tile" onclick="openScreen('store')">
            <div class="icon">🎁</div>
            <h2>TIENDA</h2>
        </div>
    </main>
</div>

<!-- ══════════════ CLUB ══════════════ -->
<div id="club" class="screen">
    <div class="sec-top">
        <h1 class="sec-title">MI <span>CLUB</span></h1>
        <div class="sec-actions">
            <button class="btn-red"  onclick="sellDups()">Vender Repetidos</button>
            <button class="btn-back" onclick="closeScreen('club')">VOLVER</button>
        </div>
    </div>
    <div id="my-listings" style="display:none; margin-bottom:35px;">
        <div class="sub-title">MIS SUBASTAS ACTIVAS</div>
        <div class="grid" id="listings-grid"></div>
        <hr style="border:0; border-top:1px solid rgba(0,255,170,0.15); margin-top:30px;">
    </div>
    <div class="sub-title">MI PLANTILLA</div>
    <div class="grid" id="club-grid"></div>
</div>

<!-- ══════════════ MARKET ══════════════ -->
<div id="market" class="screen">
    <div class="sec-top">
        <h1 class="sec-title">MERCADO DE <span>FICHAJES</span></h1>
        <button class="btn-back" onclick="closeScreen('market')">VOLVER</button>
    </div>
    <div class="grid" id="market-grid"></div>
</div>

<!-- ══════════════ STORE ══════════════ -->
<div id="store" class="screen">
    <div class="sec-top">
        <h1 class="sec-title">TIENDA DE <span>SOBRES</span></h1>
        <button class="btn-back" onclick="closeScreen('store')">VOLVER</button>
    </div>
    <div class="packs-row">
        <div class="pack pack-bronce">
            <div class="pack-name">BRONCE</div>
            <div class="pack-range">55 – 75 GRL</div>
            <div class="pack-btns">
                <button class="btn-pack" onclick="openPack('bronce','gratis')">ABRIR GRATIS</button>
            </div>
        </div>
        <div class="pack pack-plata">
            <div class="pack-name">PLATA</div>
            <div class="pack-range">66 – 85 GRL</div>
            <div class="pack-btns">
                <button class="btn-pack"     onclick="openPack('plata','coins')">🪙 1,000</button>
                <button class="btn-pack pts" onclick="openPack('plata','points')">💎 20</button>
            </div>
        </div>
        <div class="pack pack-oro">
            <div class="pack-name">ORO</div>
            <div class="pack-range">75 – 95 GRL</div>
            <div class="pack-btns">
                <button class="btn-pack"     onclick="openPack('oro','coins')">🪙 5,000</button>
                <button class="btn-pack pts" onclick="openPack('oro','points')">💎 100</button>
            </div>
        </div>
    </div>
</div>

<!-- ══════════════ REVEAL ══════════════ -->
<div id="reveal">
    <div id="reveal-slot"></div>
    <button id="btn-cont" onclick="closeReveal()">CONTINUAR</button>
</div>

<!-- ══════════════ SELL MODAL ══════════════ -->
<div id="sell-modal" class="modal-bg">
    <div class="modal-box">
        <div class="modal-title">PONER A LA <span style="color:var(--primary)">VENTA</span></div>
        <div id="modal-card"></div>
        <input type="number" id="inp-price" placeholder="PRECIO 🪙" min="1">
        <div class="modal-btns">
            <button class="btn-m green"  id="btn-confirm-sell">PUBLICAR</button>
            <button class="btn-m grey"   onclick="closeSell()">CANCELAR</button>
        </div>
    </div>
</div>

<!-- ══════════════ CONFIRM MODAL ══════════════ -->
<div id="confirm-modal" class="modal-bg">
    <div class="modal-box red">
        <div class="modal-title" style="color:#ff3232">¿ESTÁS SEGURO?</div>
        <div class="modal-body" id="confirm-text"></div>
        <div class="modal-btns">
            <button class="btn-m crimson" id="btn-yes">SÍ, CONFIRMAR</button>
            <button class="btn-m grey"    onclick="closeConfirm()">CANCELAR</button>
        </div>
    </div>
</div>

<!-- ══════════════ FIREBASE + LOGIC ══════════════ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
    getFirestore, doc, onSnapshot, setDoc, updateDoc,
    collection, addDoc, deleteDoc, query, orderBy, getDoc, getDocs, where
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    onAuthStateChanged, signOut, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* ─── CONFIG ─── */
const FB = {
    apiKey: "AIzaSyAbqA2K0AJcIuN4JVUAI6VrKCiQF2xX0gQ",
    authDomain: "mps-ut-26.firebaseapp.com",
    projectId: "mps-ut-26",
    storageBucket: "mps-ut-26.firebasestorage.app",
    messagingSenderId: "524484879031",
    appId: "1:524484879031:web:ee60cdb79834f689646332"
};
const SHEET = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRZ3aXiCltsIuIyA9lWBNSF6svc6QAxIHuQ8nkqS7NnBNUK0NWAsc5tNn8hDbcUff-IHJzI2hsg4Lj/pub?output=csv";
const DISC = { bronce: 30, plata: 100, oro: 500, especial: 1000 };
const PACKS = {
    bronce: { coins: 0,    points: 0,   odds: [[55,60,90],[61,65,99],[66,70,99.8],[71,75,100]] },
    plata:  { coins: 1000, points: 20,  odds: [[66,70,90],[71,75,99],[76,80,99.8],[81,85,100]] },
    oro:    { coins: 5000, points: 100, odds: [[75,80,90],[81,85,99],[86,90,99.8],[91,95,100]] }
};

/* ─── STATE ─── */
const app  = initializeApp(FB);
const db   = getFirestore(app);
const auth = getAuth(app);
let players = [];
let gd = { coins: 0, points: 0, inventario: [], username: "" };
let pendingFn = null, sellId = null;

/* ─── MUSIC ─── */
const tracks = [
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/assets/musica/feetdo.mp3',
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/assets/musica/geni.mp3',
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/assets/musica/loveme.mp3',
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/assets/musica/ArrDee%20-%20Oliver%20Twist%20%5BMusic%20Video%5D%20%20GRM%20Daily.mp3',
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/ijuswant.mp3',
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/assets/musica/Imagine%20Dragons%20-%20On%20Top%20Of%20The%20World%20(Official%20Music%20Video).mp3',
    'https://raw.githubusercontent.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/main/assets/musica/Young%20Miko%20-%20WASSUP%20(Official).mp3'
];
const bgm = new Audio(); bgm.volume = 0.2;
let musicOn = false;
const nextTrack = () => { bgm.src = tracks[Math.floor(Math.random()*tracks.length)]; bgm.play().catch(()=>{}); };
bgm.onended = nextTrack;
document.addEventListener('click', () => { if (!musicOn) { nextTrack(); musicOn = true; } }, { once: true });

/* ─── TOAST ─── */
function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'ok' ? '' : ` ${type}`);
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3600);
}

/* ─── CARD HTML ─── */
function cardHTML(j, extraClass = '') {
    return `<div class="card ${j.rareza} ${extraClass}">
        <div class="ovr">${j.grl}</div>
        <div class="pos">${j.pos}</div>
        <img src="${j.foto}" alt="${j.name}" onerror="this.style.display='none'">
        <div class="name">${j.name}</div>
    </div>`;
}

/* ─── AUTH ─── */
onAuthStateChanged(auth, u => {
    if (u) { startLoad(u.uid); }
    else {
        document.getElementById('auth-form').style.display = 'flex';
        document.getElementById('progress-wrap').style.display = 'none';
    }
});

document.getElementById('btn-register').onclick = async () => {
    const nick = document.getElementById('auth-user').value.trim();
    const pass = document.getElementById('auth-pass').value;
    if (!nick || pass.length < 6) return toast("Mínimo 6 caracteres en la contraseña.", 'error');
    try {
        await setPersistence(auth, browserLocalPersistence);
        const c = await createUserWithEmailAndPassword(auth, `${nick.toLowerCase()}@mps.com`, pass);
        await setDoc(doc(db, "jugadores", c.user.uid), { username: nick.toUpperCase(), coins: 5000, points: 0, inventario: [] });
    } catch { toast("Error. ¿El usuario ya existe?", 'error'); }
};

document.getElementById('btn-login').onclick = async () => {
    const nick = document.getElementById('auth-user').value.trim();
    const pass = document.getElementById('auth-pass').value;
    try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(auth, `${nick.toLowerCase()}@mps.com`, pass);
    } catch { toast("Usuario o contraseña incorrectos.", 'error'); }
};

document.getElementById('btn-logout').onclick = async () => { await signOut(auth); location.reload(); };

/* ─── LOAD ─── */
async function startLoad(uid) {
    document.getElementById('auth-form').style.display = 'none';
    document.getElementById('progress-wrap').style.display = 'block';
    const bar = document.getElementById('progress-bar');

    try {
        const res = await fetch(SHEET);
        if (res.ok) {
            const csv = await res.text();
            players = csv.split('\n').slice(1).map(row => {
                const d = row.split(',');
                return { id: d[0]?.trim(), name: d[1]?.trim(), grl: parseInt(d[2]?.trim())||0, pos: d[3]?.trim(), rareza: d[4]?.trim().toLowerCase(), foto: d[5]?.trim() };
            }).filter(p => p.id && p.name);
        }
    } catch { console.warn("Error cargando jugadores."); }

    bar.style.width = "50%";

    onSnapshot(doc(db, "jugadores", uid), snap => {
        if (!snap.exists()) return;
        gd = snap.data();
        if (!gd.inventario) gd.inventario = [];
        refreshHUD();
        if (document.getElementById('club').classList.contains('open')) renderClub();
        bar.style.width = "100%";
        document.getElementById('btn-enter').classList.add('ready');
    });

    const q = query(collection(db, "mercado"), orderBy("fecha", "desc"));
    onSnapshot(q, snap => renderMarket(snap));
}

function refreshHUD() {
    document.getElementById('s-coins').textContent  = `🪙 ${gd.coins.toLocaleString('es-ES')}`;
    document.getElementById('s-points').textContent = `💎 ${gd.points.toLocaleString('es-ES')}`;
}

/* ─── NAV ─── */
window.enterGame = () => {
    document.getElementById('user-display').innerHTML = `MPS 26 &nbsp;|&nbsp; <strong>${gd.username}</strong>`;
    document.getElementById('loader').classList.add('hide');
    setTimeout(() => document.getElementById('app').classList.add('on'), 800);
};
window.openScreen  = id => { document.getElementById(id).classList.add('open'); if (id === 'club') renderClub(); };
window.closeScreen = id => document.getElementById(id).classList.remove('open');

/* ─── CLUB ─── */
window.renderClub = async function () {
    const cGrid    = document.getElementById('club-grid');
    const lGrid    = document.getElementById('listings-grid');
    const lSection = document.getElementById('my-listings');
    if (!cGrid) return;
    cGrid.innerHTML = '';
    lGrid.innerHTML = '';

    // My active listings
    try {
        const snap = await getDocs(query(collection(db, "mercado"), where("vendedorId", "==", auth.currentUser.uid)));
        if (!snap.empty) {
            lSection.style.display = 'block';
            snap.forEach(ds => {
                const o = ds.data();
                const j = players.find(p => p.id === o.jugadorId);
                if (!j) return;
                const wrap = document.createElement('div');
                wrap.className = 'card-wrap';
                wrap.innerHTML = `
                    <div class="card ${j.rareza} dim">
                        <div class="badge-sale">EN VENTA</div>
                        <div class="ovr">${j.grl}</div><div class="pos">${j.pos}</div>
                        <img src="${j.foto}" onerror="this.style.display='none'">
                        <div class="name">${j.name}</div>
                    </div>
                    <div class="card-btns">
                        <div class="price-tag">🪙 ${o.precio.toLocaleString()}</div>
                        <button class="btn-c danger" onclick="cancelListing('${ds.id}','${j.id}')">RETIRAR</button>
                    </div>`;
                lGrid.appendChild(wrap);
            });
        } else { lSection.style.display = 'none'; }
    } catch (e) { console.error(e); }

    // Squad
    if (gd.inventario?.length) {
        [...gd.inventario]
            .map(id => players.find(j => j.id === id)).filter(Boolean)
            .sort((a,b) => b.grl - a.grl)
            .forEach(j => {
                const dv = DISC[j.rareza] || 30;
                const wrap = document.createElement('div');
                wrap.className = 'card-wrap';
                wrap.innerHTML = `
                    ${cardHTML(j)}
                    <div class="card-btns">
                        <button class="btn-c white"  onclick="openSell('${j.id}')">VENDER MERCADO</button>
                        <button class="btn-c danger" onclick="askDiscard('${j.id}')">DESCARTAR (🪙${dv})</button>
                    </div>`;
                cGrid.appendChild(wrap);
            });
    } else {
        cGrid.innerHTML = `<div class="empty"><div class="ico">📭</div><p>Club vacío — ¡abre sobres!</p></div>`;
    }
};

window.cancelListing = async (docId, pid) => {
    try {
        await deleteDoc(doc(db, "mercado", docId));
        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { inventario: [...gd.inventario, pid] });
        toast("Jugador retirado del mercado.");
    } catch { toast("Error al retirar.", 'error'); }
};

window.askDiscard = id => {
    const j = players.find(p => p.id === id), v = DISC[j.rareza]||30;
    document.getElementById('confirm-text').textContent = `Vas a descartar a ${j.name} (${j.grl} GRL) por 🪙${v}. Acción irreversible.`;
    document.getElementById('confirm-modal').classList.add('open');
    pendingFn = async () => {
        const inv = [...gd.inventario]; inv.splice(inv.indexOf(id), 1);
        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { inventario: inv, coins: gd.coins + v });
        closeConfirm(); toast(`+🪙${v} recibidos.`);
    };
};

window.sellDups = () => {
    let uniq = [], bonus = 0, count = 0;
    gd.inventario.forEach(id => {
        if (!uniq.includes(id)) { uniq.push(id); }
        else { const j = players.find(p => p.id === id); bonus += DISC[j?.rareza]||30; count++; }
    });
    if (!count) return toast("Sin repetidos.", 'warning');
    document.getElementById('confirm-text').textContent = `Vender ${count} jugadores repetidos por 🪙${bonus.toLocaleString()}.`;
    document.getElementById('confirm-modal').classList.add('open');
    pendingFn = async () => {
        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { inventario: uniq, coins: gd.coins + bonus });
        closeConfirm(); toast(`¡+🪙${bonus.toLocaleString()} por ${count} repetidos!`);
    };
};

document.getElementById('btn-yes').onclick    = () => { if (pendingFn) pendingFn(); };
window.closeConfirm = () => { document.getElementById('confirm-modal').classList.remove('open'); pendingFn = null; };

/* ─── SELL MODAL ─── */
window.openSell = pid => {
    sellId = pid;
    const j = players.find(p => p.id === pid);
    document.getElementById('modal-card').innerHTML = cardHTML(j);
    document.getElementById('inp-price').value = '';
    document.getElementById('sell-modal').classList.add('open');
};
window.closeSell = () => { document.getElementById('sell-modal').classList.remove('open'); sellId = null; };

document.getElementById('btn-confirm-sell').onclick = async () => {
    const price = parseInt(document.getElementById('inp-price').value);
    if (!price || price <= 0) return toast("Introduce un precio válido.", 'error');
    const inv = [...gd.inventario]; inv.splice(inv.indexOf(sellId), 1);
    try {
        closeSell();
        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { inventario: inv });
        await addDoc(collection(db, "mercado"), { jugadorId: sellId, precio: price, vendedorId: auth.currentUser.uid, vendedorNombre: gd.username, fecha: Date.now() });
        toast("¡Publicado en el mercado!");
    } catch { toast("Error al publicar.", 'error'); }
};

/* ─── MARKET ─── */
function renderMarket(snapshot) {
    const grid = document.getElementById('market-grid');
    if (!grid) return;
    grid.innerHTML = '';
    if (snapshot.empty) { grid.innerHTML = `<div class="empty"><div class="ico">🏪</div><p>Sin ofertas disponibles</p></div>`; return; }
    snapshot.forEach(ds => {
        const o = ds.data(), j = players.find(p => p.id === o.jugadorId);
        if (!j) return;
        const isOwn = o.vendedorId === auth.currentUser?.uid;
        const wrap = document.createElement('div');
        wrap.className = 'card-wrap';
        wrap.innerHTML = `
            ${cardHTML(j)}
            <div class="card-btns">
                <div class="seller-tag">POR: ${o.vendedorNombre}</div>
                <button class="btn-c ${isOwn ? 'danger' : ''}"
                    onclick="${isOwn ? `cancelListing('${ds.id}','${j.id}')` : `buyPlayer('${ds.id}',${o.precio},'${o.vendedorId}','${j.id}')`}">
                    ${isOwn ? 'RETIRAR' : `COMPRAR 🪙${o.precio.toLocaleString()}`}
                </button>
            </div>`;
        grid.appendChild(wrap);
    });
}

window.buyPlayer = async (offerId, price, sellerId, pid) => {
    if (gd.coins < price) return toast("Monedas insuficientes.", 'error');
    if (sellerId === auth.currentUser.uid) return toast("Es tu propia carta.", 'warning');
    try {
        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { coins: gd.coins - price, inventario: [...gd.inventario, pid] });
        const sellerSnap = await getDoc(doc(db, "jugadores", sellerId));
        await updateDoc(doc(db, "jugadores", sellerId), { coins: sellerSnap.data().coins + price });
        await deleteDoc(doc(db, "mercado", offerId));
        toast("¡Jugador fichado!");
    } catch { toast("Error en el fichaje.", 'error'); }
};

/* ─── PACKS ─── */
window.openPack = async (type, pay) => {
    const cfg = PACKS[type];
    if (pay === 'coins'  && gd.coins  < cfg.coins)  return toast("Monedas insuficientes.", 'error');
    if (pay === 'points' && gd.points < cfg.points) return toast("MPS Points insuficientes.", 'error');

    const roll = Math.random() * 100;
    let minG, maxG;
    for (const [mn, mx, prob] of cfg.odds) { if (roll <= prob) { minG = mn; maxG = mx; break; } }

    const pool = players.filter(p => p.grl >= minG && p.grl <= maxG);
    const pick = pool.length ? pool[Math.floor(Math.random()*pool.length)] : players[Math.floor(Math.random()*players.length)];

    try {
        const upd = { inventario: [...gd.inventario, pick.id] };
        if (pay === 'coins')  upd.coins  = gd.coins  - cfg.coins;
        if (pay === 'points') upd.points = gd.points - cfg.points;
        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), upd);
        showReveal(pick);
    } catch (e) { console.error(e); toast("Error al abrir sobre.", 'error'); }
};

function showReveal(j) {
    const ov   = document.getElementById('reveal');
    const slot = document.getElementById('reveal-slot');
    const btn  = document.getElementById('btn-cont');
    if (j.grl >= 86)      ov.style.background = "radial-gradient(circle, #f1c40f 0%, #000 100%)";
    else if (j.grl >= 75) ov.style.background = "radial-gradient(circle, #2c3e50 0%, #000 100%)";
    else                  ov.style.background = "radial-gradient(circle, #1a0808 0%, #000 100%)";
    slot.innerHTML = `
        <div class="card ${j.rareza} walkout" style="width:280px">
            <div class="ovr" style="font-size:2.2rem">${j.grl}</div>
            <div class="pos">${j.pos}</div>
            <img src="${j.foto}" onerror="this.style.display='none'">
            <div class="name" style="font-size:1.35rem">${j.name}</div>
        </div>`;
    btn.style.display = 'none';
    ov.classList.add('open');
    setTimeout(() => btn.style.display = 'block', 2300);
}

window.closeReveal = () => {
    document.getElementById('reveal').classList.remove('open');
    if (document.getElementById('club').classList.contains('open')) renderClub();
};
</script>
