<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS Ultimate Team 2026</title>
    <style>
        :root {
            --primary: #00ffaa;
            --bg: #050508;
            --smooth-curve: cubic-bezier(0.19, 1, 0.22, 1);
            --bg-oro: url('https://cdn3.futbin.com/content/fifa26/img/cards/hd/1_gold.png?fm=png&ixlib=java-2.1.0&verzion=5&w=644&s=f0389e2700687b8be1ceb7f5294462ae');
            --bg-plata: url('https://cdn3.futbin.com/content/fifa26/img/cards/hd/1_silver.png?fm=png&ixlib=java-2.1.0&verzion=5&w=644&s=b1079f24f16767420cb6396ed3f5fe9b');
            --bg-bronce: url('https://cdn3.futbin.com/content/fifa26/img/cards/hd/1_bronze.png?fm=png&ixlib=java-2.1.0&verzion=5&w=644&s=4ad307433d3abe0e4eaf4e06573784e0');
            --especial: linear-gradient(135deg, #00ffaa 0%, #0066ff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DIN Condensed', 'Arial Narrow', sans-serif; }
        body { background-color: var(--bg); color: white; overflow: hidden; height: 100vh; }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 30% 50%, #1a1a2e 0%, #050508 100%);
            display: flex; align-items: center; z-index: 1000;
            transition: opacity 0.8s var(--smooth-curve), visibility 0.8s; padding: 0 10%;
        }
        .loader-left { position: relative; flex: 1; z-index: 10; }
        .loader-logo { font-size: 8rem; font-weight: 900; font-style: italic; margin-bottom: -10px; color: white; letter-spacing: -3px; line-height: 1; }
        .edition { color: var(--primary); font-size: 1.8rem; margin-bottom: 30px; letter-spacing: 8px; font-weight: bold; }
        #auth-form { display: flex; flex-direction: column; gap: 12px; width: 350px; margin-bottom: 20px; }
        #auth-form input { background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,170,0.3); padding: 12px; color: white; border-radius: 4px; outline: none; font-size: 1.1rem; transition: 0.3s; }
        #auth-form input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        .auth-buttons { display: flex; gap: 10px; }
        .btn-action { flex: 1; padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; transition: 0.3s; }
        #login-btn { background: var(--primary); color: black; border: none; }
        #register-btn { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .progress-container { width: 350px; height: 6px; background: rgba(255,255,255,0.1); margin-bottom: 30px; border-radius: 10px; overflow: hidden; display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); box-shadow: 0 0 20px var(--primary); transition: width 0.4s ease; }
        #continue-btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 15px 45px; font-size: 1.8rem; text-transform: uppercase; font-style: italic; cursor: pointer; opacity: 0; transform: translateY(30px); transition: all 0.5s var(--smooth-curve); pointer-events: none; border-radius: 4px; }
        #continue-btn.ready { opacity: 1; transform: translateY(0); pointer-events: auto; animation: blink 1.5s infinite; }
        .player-render { position: absolute; left: 15%; bottom: -5%; height: 115vh; z-index: 1; pointer-events: none; }
        .player-render img { height: 100%; width: auto; filter: drop-shadow(20px 0 50px rgba(0,255,170,0.15)); animation: slideIn 1.8s var(--smooth-curve); }

        @keyframes slideIn { from { transform: translateX(-150px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--primary); } 50% { opacity: 0.7; box-shadow: 0 0 25px var(--primary); } }

        #main-content { opacity: 0; display: flex; flex-direction: column; height: 100vh; transition: opacity 1s ease; pointer-events: none; }
        header { padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; }
        .user-box { display: flex; align-items: center; gap: 20px; }
        #logout-btn { background: rgba(255,50,50,0.2); border: 1px solid #ff3232; color: #ff3232; padding: 5px 15px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; }
        .stats { display: flex; gap: 20px; background: rgba(255,255,255,0.05); padding: 10px 25px; border-radius: 50px; }
        .main-menu { flex: 1; display: flex; padding: 0 40px 60px; gap: 15px; }
        .menu-btn { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 40px; display: flex; flex-direction: column; justify-content: flex-end; transition: flex 0.6s var(--smooth-curve), background 0.4s ease; cursor: pointer; position: relative; overflow: hidden; }
        .menu-btn:hover { flex: 3; background: rgba(255,255,255,0.08); border-color: var(--primary); }
        .menu-btn h2 { font-size: 3.5rem; text-transform: uppercase; font-style: italic; line-height: 0.9; }

        .full-screen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #10101a 0%, #050508 100%); z-index: 500; display: none; padding: 60px; overflow-y: auto; animation: fadeIn 0.4s var(--smooth-curve); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid rgba(0,255,170,0.2); padding-bottom: 20px; }
        .italic-title { font-size: 3.5rem; font-style: italic; text-transform: uppercase; }
        .primary-text { color: var(--primary); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 50px 25px; align-items: start; }
        .card-wrapper { display: flex; flex-direction: column; gap: 8px; }
        .card { aspect-ratio: 2/3; border-radius: 0; padding: 0; position: relative; color: #3e3e3e; text-align: center; transition: transform 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.4); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; overflow: hidden; }
        .card:hover { transform: translateY(-5px) scale(1.02); z-index: 2; }
        .card.oro { background-image: var(--bg-oro); color: #3e3e3e; }
        .card.plata { background-image: var(--bg-plata); color: #3e3e3e; }
        .card.bronce { background-image: var(--bg-bronce); color: #3e3e3e; }
        .card.especial { background: var(--especial); color: white; border-radius: 10px; }
        .card img { width: 80%; position: absolute; top: 22%; left: 50%; transform: translateX(-50%); z-index: 0; }
        .card .ovr { position: absolute; top: 18%; left: 18%; font-size: 1.6rem; font-weight: 900; z-index: 1; }
        .card .pos { position: absolute; top: 32%; left: 18%; font-size: 0.9rem; font-weight: bold; z-index: 1; }
        .card .name { position: absolute; bottom: 18%; width: 100%; font-weight: 900; text-transform: uppercase; text-align: center; font-size: 1rem; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }

        .card-actions-container { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .btn-card-action { position: static; width: 100%; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s; text-transform: uppercase; }
        .btn-card-action:hover { background: var(--primary); color: black; border-color: var(--primary); }
        .seller-info { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; text-align: center; color: rgba(255,255,255,0.7); margin-bottom: 2px; }

        .btn-ui { padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; border: none; text-transform: uppercase; }
        .btn-back { background: white; color: black; }
        .btn-back:hover { background: var(--primary); }
        .btn-duplicates { background: #ff3232; color: white; margin-right: 10px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a2e; border: 2px solid var(--primary); padding: 30px; border-radius: 15px; text-align: center; width: 320px; box-shadow: 0 0 50px rgba(0,255,170,0.2); animation: slideUp 0.3s var(--smooth-curve); }
        #input-precio-venta { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--primary); padding: 12px; color: white; border-radius: 4px; font-size: 1.5rem; margin-top: 20px; outline: none; text-align: center; }
        #modal-card-preview { margin: 15px auto; width: 160px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .sub-titulo { font-size: 1.8rem; font-style: italic; color: var(--primary); margin-bottom: 20px; text-transform: uppercase; border-left: 4px solid var(--primary); padding-left: 15px; }
        .card-venda { filter: saturate(0.5); }
        .badge-venta { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); background: #ff3232; color: white; padding: 5px 15px; font-weight: bold; font-size: 1.2rem; border: 2px solid white; z-index: 15; pointer-events: none; box-shadow: 0 0 15px rgba(255,50,50,0.5); }

        .pack-container { display: flex; justify-content: center; align-items: center; gap: 40px; padding: 20px 30px; height: calc(100vh - 160px); }
        .pack { display: flex; flex-direction: column; align-items: center; gap: 10px; background: transparent; border-radius: 12px; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; border: 3px solid var(--primary); padding: 12px; }
        .pack:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--primary); }

        .pack-detail-content {
            display: flex; width: 80vw; max-width: 900px; height: 560px;
            background: #0e0e1a; border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,0.8);
            animation: slideUp 0.3s var(--smooth-curve);
        }
        .pack-detail-left { flex: 1; min-width: 0; }
        .pack-detail-left img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .pack-detail-right { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 50px 40px; background: #0e0e1a; }
        .pack-detail-right .btn-comprar { width: 100%; padding: 14px; font-size: 1rem; font-weight: bold; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; letter-spacing: 1px; }
        .pack-detail-right .btn-comprar:hover { filter: brightness(1.15); transform: translateY(-1px); }

        #reveal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a2e 0%, #050508 100%); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .walkout-animation { animation: packFlash 1.5s forwards, slideUp 0.8s var(--smooth-curve); }
        @keyframes packFlash { 0% { filter: brightness(1) blur(0px); } 50% { filter: brightness(5) blur(15px); } 100% { filter: brightness(1) blur(0px); } }

        /* BORDE DE ADVERTENCIA EN PANTALLA COMPLETA */
        body.advertencia-elite::before {
            content: '';
            position: fixed;
            inset: 0;
            border: 6px solid #ff3232;
            z-index: 9999;
            pointer-events: none;
            box-shadow: inset 0 0 60px rgba(255,50,50,0.35), 0 0 60px rgba(255,50,50,0.35);
            animation: pulseBorde 1.2s ease-in-out infinite;
        }
        @keyframes pulseBorde {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.45; }
        }

        /* MODAL DE NOTIFICACION */
        .notif-icon { font-size: 2.8rem; margin-bottom: 8px; }
        #notif-modal .modal-content { width: 360px; }
        #notif-title { font-size: 1.8rem; margin-bottom: 4px; }
        #notif-text { margin: 14px 0 6px; font-size: 1.05rem; color: rgba(255,255,255,0.82); line-height: 1.5; font-style: normal; font-family: 'Arial Narrow', sans-serif; }
        #notif-close-btn { margin-top: 18px; width: 100%; padding: 13px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; border: none; letter-spacing: 1px; transition: 0.2s; }
        #notif-close-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-left">
            <div class="loader-logo">MPS UT</div>
            <div class="edition">SEASON 2026</div>
            <div id="auth-form">
                <input type="text" id="auth-user" placeholder="USUARIO">
                <input type="password" id="auth-pass" placeholder="CONTRASEÑA">
                <div class="auth-buttons">
                    <button class="btn-action" id="login-btn">ENTRAR</button>
                    <button class="btn-action" id="register-btn">REGISTRAR</button>
                </div>
            </div>
            <div class="progress-container" id="p-container">
                <div id="progress" class="progress-bar"></div>
            </div>
            <button id="continue-btn" onclick="enterGame()">CLICK PARA EMPEZAR</button>
        </div>
        <div class="player-render">
            <img src="https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/main/assets/lostscout.png?raw=true">
        </div>
    </div>

    <div id="main-content">
        <header>
            <div class="user-box">
                <div id="user-display">CONECTANDO...</div>
                <button id="logout-btn">CERRAR SESIÓN</button>

                <span id="points-display">💎 --</span>
            </div>

        <main class="main-menu">

    <div id="club-section" class="full-screen-overlay">

    <div id="mercado-section" class="full-screen-overlay">

    <div id="venta-modal" class="modal-overlay">

                <button class="btn-action" id="confirmar-venta-btn" style="background:var(--primary); color:black;">PUBLICAR</button>

    <div id="tienda-section" class="full-screen-overlay">

        </div>
        <div class="pack-container">
            <div class="pack" style="border-color:#cd7f32;" onclick="abrirModalPack('bronce')">

            </div>

                <img src="https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/main/assets/splata.png?raw=true" style="width:320px; height:460px; object-fit:cover; border-radius:8px; display:block; margin:0 auto; object-position:center;">
            </div>
            <div class="pack" style="border-color:#f1c40f;" onclick="abrirModalPack('oro')">
                <img src="https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/main/assets/soro.png?raw=true" style="width:320px; height:460px; object-fit:cover; border-radius:8px; display:block; margin:0 auto; object-position:center;">

            <div class="pack-detail-right">

            <p id="notif-text"></p>
            <button id="notif-close-btn" onclick="cerrarNotif()">ENTENDIDO</button>
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, collection, addDoc, deleteDoc, query, orderBy, getDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ── CONFIG ──────────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyAbqA2K0AJcIuN4JVUAI6VrKCiQF2xX0gQ",
            authDomain: "mps-ut-26.firebaseapp.com",
            projectId: "mps-ut-26",
            storageBucket: "mps-ut-26.firebasestorage.app",
            messagingSenderId: "524484879031",
            appId: "1:524484879031:web:ee60cdb79834f689646332"
        };
        const app  = initializeApp(firebaseConfig);
        const db   = getFirestore(app);
        const auth = getAuth(app);

        const SHEET_URL       = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTRZ3aXiCltsIuIyA9lWBNSF6svc6QAxIHuQ8nkqS7NnBNUK0NWAsc5tNn8hDbcUff-IHJzI2hsg4Lj/pub?output=csv";
        const ROBLOX_FALLBACK = "https://tr.rbxcdn.com/38c9c0fcce0f3ae07e2ac9e5afe7e9b2/150/150/AvatarHeadshot/Png";
        const PRECIOS_VENTA   = { bronce: 30, plata: 100, oro: 500, especial: 1000 };

        let databaseJugadores = [];
        let gameData = { coins: 0, points: 0, inventario: [], username: "" };
        let jugadorSeleccionadoParaVenta = null;
        let accionPendiente = null;
        let mercadoSuscrito = false;

        // ── NOTIFICACION IN-GAME (reemplaza todos los alert) ────
        function notif(mensaje, tipo = 'error') {
            const modal    = document.getElementById('notif-modal');
            const title    = document.getElementById('notif-title');
            const text     = document.getElementById('notif-text');
            const icon     = document.getElementById('notif-icon');
            const btn      = document.getElementById('notif-close-btn');
            const content  = modal.querySelector('.modal-content');

            if (tipo === 'error') {
                icon.textContent      = '⛔';
                title.textContent     = 'ERROR';
                title.style.color     = '#ff3232';
                content.style.borderColor = '#ff3232';
                btn.style.background  = '#ff3232';
                btn.style.color       = 'white';
            } else if (tipo === 'aviso') {
                icon.textContent      = '⚠️';

        // ── CARGA INICIAL ────────────────────────────────────────
        async function startGameLoad(uid) {
            document.getElementById('auth-form').style.display = 'none';
            document.getElementById('p-container').style.display = 'block';
            const bar = document.getElementById('progress');

            try {
                const res = await fetch(SHEET_URL);
                if (res.ok) {
                    const csv = await res.text();
                    databaseJugadores = csv.split('\n').slice(1)
                        .map(fila => {
                            const d = parsearCSVFila(fila);
                            return {
                                id:       d[0]?.trim(),
                                name:     d[1]?.trim(),
                                grl:      parseInt(d[2]?.trim()) || 0,
                                pos:      d[3]?.trim(),
                                rareza:   d[4]?.trim().toLowerCase(),
                                robloxId: d[5]?.trim(),
                                foto:     ''
                            };
                        })
                        .filter(j => j.id);
                }
            } catch { console.warn("Error cargando Sheets"); }

            bar.style.width = "50%";
            cargarFotosRoblox();

            onSnapshot(doc(db, "jugadores", uid), snap => {
                if (snap.exists()) {
                    gameData = snap.data();
                    if (!gameData.inventario) gameData.inventario = [];
                    actualizarUI();
                    if (document.getElementById('club-section').style.display === "block") renderizarClub();
                    bar.style.width = "100%";
                    document.getElementById('continue-btn').classList.add('ready');
                }
            });
        }

        function parsearCSVFila(fila) {
            const resultado = [];
            let actual = '';
            let dentroComillas = false;
            for (const char of fila) {
                if (char === '"') { dentroComillas = !dentroComillas; }
                else if (char === ',' && !dentroComillas) { resultado.push(actual); actual = ''; }
                else { actual += char; }
            }
            resultado.push(actual);
            return resultado;
        }

        // ── FOTOS ROBLOX ─────────────────────────────────────────
        async function cargarFotosRoblox() {
            const ids = [...new Set(
                databaseJugadores.map(j => j.robloxId).filter(id => id && !isNaN(Number(id)))
            )];
            if (ids.length === 0) return;

            const fotosMap = {};
            const BATCH = 100;

            for (let i = 0; i < ids.length; i += BATCH) {
                const lote = ids.slice(i, i + BATCH);
                const robloxUrl = `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${lote.join(',')}&size=420x420&format=Png&isCircular=false`;
                try {
                    const res  = await fetch(`https://corsproxy.io/?${encodeURIComponent(robloxUrl)}`);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const json = await res.json();
                    for (const item of (json.data || [])) {
                        fotosMap[String(item.targetId)] = (item.state === 'Completed' && item.imageUrl)
                            ? item.imageUrl : ROBLOX_FALLBACK;
                    }
                } catch {
                    for (const id of lote) {
                        fotosMap[id] = fotosMap[id] || `https://www.roblox.com/headshot-thumbnail/image?userId=${id}&width=420&height=420&format=png`;
                    }
                }
            }

            for (const j of databaseJugadores) {
                j.foto = (j.robloxId && fotosMap[j.robloxId]) ? fotosMap[j.robloxId] : ROBLOX_FALLBACK;
            }
        }

        function imgTag(foto) {
            return `<img src="${foto}" onerror="this.onerror=null;this.src='${ROBLOX_FALLBACK}'">`;
        }

                if (!snap.empty) {
                    seccionVentas.style.display = "block";
                    snap.forEach(docSnap => {
                        const oferta = docSnap.data();
                        const j = databaseJugadores.find(p => p.id === oferta.jugadorId);

                        const wrapper = document.createElement('div');
                        wrapper.className = 'card-wrapper';
                        wrapper.innerHTML = `

            if (gameData.inventario?.length > 0) {

                            </div>`;

        // ── MERCADO ──────────────────────────────────────────────

        // ── NAVEGACIÓN ───────────────────────────────────────────
        window.abrirSeccion = (id) => {

        // ── ACCIONES DE CARTAS ───────────────────────────────────
        window.cancelarVenta = async (docId, jugadorId) => {
            try {
                await deleteDoc(doc(db, "mercado", docId));

        window.descartarJugador = (id) => {
            const j = databaseJugadores.find(p => p.id === id);
            const valor = PRECIOS_VENTA[j.rareza] || 30;
            document.getElementById('confirm-text').innerText = `Vas a descartar a ${j.name} por 🪙 ${valor}. Esta acción no se puede deshacer.`;
            document.getElementById('confirm-modal').style.display = "flex";
            accionPendiente = async () => {
                const nuevoInv = [...gameData.inventario];
                nuevoInv.splice(nuevoInv.indexOf(id), 1);
                await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { inventario: nuevoInv, coins: gameData.coins + valor });
                cerrarConfirmacion();

        };

        window.cerrarConfirmacion = () => {
            document.getElementById('confirm-modal').style.display = "none";
            accionPendiente = null;
        };
        document.getElementById('btn-confirm-yes').onclick = () => { if (accionPendiente) accionPendiente(); };

        window.venderRepetidos = () => {
            let monedasGanadas = 0, repetidosContador = 0;
            const unicos = [];
            const eliteRepetidos = [];

            gameData.inventario.forEach(id => {
                if (!unicos.includes(id)) {
                    unicos.push(id);
                } else {
                    const j = databaseJugadores.find(p => p.id === id);
                    if (j) {
                        monedasGanadas += PRECIOS_VENTA[j.rareza] || 30;
                        repetidosContador++;
                        if (j.grl >= 85) eliteRepetidos.push(j);
                    }
                }
            });

            if (repetidosContador === 0) return notif("No tienes jugadores repetidos en tu club.", 'aviso');

            if (eliteRepetidos.length > 0) {
                // Activar borde rojo pulsante en toda la pantalla
                document.body.classList.add('advertencia-elite');

                const listaElite = eliteRepetidos
                    .sort((a, b) => b.grl - a.grl)
                    .map(j => `• ${j.name} (${j.grl} GRL)`)
                    .join('\n');

                const modal   = document.getElementById('notif-modal');
                const title   = document.getElementById('notif-title');
                const text    = document.getElementById('notif-text');
                const icon    = document.getElementById('notif-icon');
                const btn     = document.getElementById('notif-close-btn');
                const content = modal.querySelector('.modal-content');

                icon.textContent          = '🚨';
                title.textContent         = '¡ATENCIÓN!';
                title.style.color         = '#ff3232';
                content.style.borderColor = '#ff3232';
                content.style.width       = '420px';
                btn.style.background      = '#ff3232';
                btn.style.color           = 'white';
                btn.textContent           = 'ENTENDIDO, CONTINUAR';

                text.style.whiteSpace     = 'pre-line';
                text.textContent          =
                    `Entre tus repetidos hay ${eliteRepetidos.length} jugador${eliteRepetidos.length > 1 ? 'es' : ''} de élite (+85 GRL) que vas a perder:\n\n${listaElite}\n\n¿Estás seguro de que quieres venderlos todos?`;

                modal.style.display = 'flex';

                // Al cerrar este aviso, abrir el confirm normal
                window.cerrarNotif = () => {
                    modal.style.display = 'none';
                    document.body.classList.remove('advertencia-elite');
                    content.style.width = '360px';
                    text.style.whiteSpace = 'normal';
                    // Restaurar cerrarNotif al comportamiento original

                        document.getElementById('notif-modal').style.display = 'none';

                    // Abrir confirmación normal
                    document.getElementById('confirm-text').innerText =
                        `Vas a vender ${repetidosContador} jugadores repetidos (incluidos ${eliteRepetidos.length} de élite) por un total de 🪙 ${monedasGanadas.toLocaleString()}.`;
                    document.getElementById('confirm-modal').style.display = 'flex';
                    accionPendiente = async () => {
                        await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { inventario: unicos, coins: gameData.coins + monedasGanadas });
                        cerrarConfirmacion();
                        notif(`Has recibido 🪙 ${monedasGanadas.toLocaleString()} por vender tus jugadores repetidos.`, 'ok');
                    };
                };

            } else {
                // Sin élites, flujo normal directo
                document.getElementById('confirm-text').innerText =
                    `Vas a vender ${repetidosContador} jugadores repetidos por un total de 🪙 ${monedasGanadas.toLocaleString()}.`;
                document.getElementById('confirm-modal').style.display = 'flex';
                accionPendiente = async () => {

        document.getElementById('confirmar-venta-btn').onclick = async () => {

            // 👇 FIX: guardamos el id en una variable LOCAL antes de cerrar el modal.
            // cerrarModalVenta() pone jugadorSeleccionadoParaVenta = null de forma síncrona,
            // así que si seguimos leyendo la variable global después de llamarla (dentro del
            // await), ya estará en null. Con la copia local evitamos esa condición de carrera.
            const idJugadorAVender = jugadorSeleccionadoParaVenta;
            if (!idJugadorAVender) return notif("No se ha seleccionado ningún jugador para vender.", 'error');

        window.ficharJugador = async (ofertaId, precio, vendedorId, jugadorId) => {

            if (vendedorId === auth.currentUser.uid) return notif("No puedes comprar tu propia carta del mercado de fichajes.", 'aviso');
            try {
                await updateDoc(doc(db, "jugadores", auth.currentUser.uid), { coins: gameData.coins - precio, inventario: [...gameData.inventario, jugadorId] });
                const vSnap = await getDoc(doc(db, "jugadores", vendedorId));
                await updateDoc(doc(db, "jugadores", vendedorId), { coins: vSnap.data().coins + precio });
                await deleteDoc(doc(db, "mercado", ofertaId));
            } catch { notif("Se produjo un error durante el fichaje. Inténtalo de nuevo.", 'error'); }
        };

        // ── SOBRES ───────────────────────────────────────────────
        window.abrirPack = async (tipoPack, metodoPago) => {
            const configs = {
                bronce: { coins: 0,    points: 0,   rangos: [[55,60,90],[61,65,99],[66,70,99.8],[71,75,100]] },
                plata:  { coins: 1000, points: 20,  rangos: [[66,70,90],[71,75,99],[76,80,99.8],[81,85,100]] },
                oro:    { coins: 5000, points: 100, rangos: [[75,80,90],[81,85,99],[86,90,99.8],[91,95,100]] }
            };
            const { coins: costoCoins, points: costoPoints, rangos } = configs[tipoPack];
            if (metodoPago === 'coins'  && gameData.coins  < costoCoins)  return notif(`No tienes suficientes monedas. Necesitas 🪙 ${costoCoins.toLocaleString()} y tienes 🪙 ${gameData.coins.toLocaleString()}.`, 'error');
            if (metodoPago === 'points' && gameData.points < costoPoints) return notif(`No tienes suficientes MPS Points. Necesitas 💎 ${costoPoints} y tienes 💎 ${gameData.points}.`, 'error');

            const azar = Math.random() * 100;
            let minGrl, maxGrl;
            for (const [min, max, prob] of rangos) { if (azar <= prob) { minGrl = min; maxGrl = max; break; } }

            const posibles = databaseJugadores.filter(j => j.grl >= minGrl && j.grl <= maxGrl);
            const elegido  = posibles.length
                ? posibles[Math.floor(Math.random() * posibles.length)]
                : databaseJugadores[Math.floor(Math.random() * databaseJugadores.length)];

            try {
                const actualizacion = { inventario: [...gameData.inventario, elegido.id] };
                if (metodoPago === 'coins')  actualizacion.coins  = gameData.coins  - costoCoins;
                if (metodoPago === 'points') actualizacion.points = gameData.points - costoPoints;
                await updateDoc(doc(db, "jugadores", auth.currentUser.uid), actualizacion);
                mostrarAnimacionPack(elegido);
            } catch (e) { console.error(e); notif("Se produjo un error al abrir el sobre. Inténtalo de nuevo.", 'error'); }
        };

        function mostrarAnimacionPack(jugador) {
            const overlay   = document.getElementById('reveal-overlay');
            const container = document.getElementById('pack-animation-container');
            const btnCerrar = document.getElementById('btn-cerrar-sobre');

            btnCerrar.style.display = 'none';
            overlay.style.background = jugador.grl >= 86
                ? "radial-gradient(circle, rgba(241,196,15,0.25) 0%, #050508 100%)"
                : jugador.grl >= 75
                    ? "radial-gradient(circle, rgba(52,73,94,0.4) 0%, #050508 100%)"
                    : "black";
            container.innerHTML = `
                <div class="card ${jugador.rareza} walkout-animation" style="width:280px; transform:scale(1.1);">
                    <div class="ovr" style="font-size:2.2rem;">${jugador.grl}</div>
                    <div class="pos">${jugador.pos}</div>
                    ${imgTag(jugador.foto)}
                    <div class="name" style="font-size:1.4rem; bottom:18%;">${jugador.name}</div>
                </div>`;
            setTimeout(() => { btnCerrar.style.display = 'block'; }, 2000);
        }

        // ── MODAL DETALLE DE SOBRE ──────────────────────────────
        const PACK_INFO = {
            bronce: {
                nombre: 'SOBRE BRONCE',
                color:  '#cd7f32',
                rating: 'Cartas 55+ GRL',
                img:    'https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/eacfef44e11bc8afda3957f7d14a71fc59c6ee94/assets/sbronce.png?raw=true',
                btns: [
                    { label: 'ABRIR GRATIS', bg: '#cd7f32', color: 'black', metodo: 'gratis' }
                ]
            },
            plata: {
                nombre: 'SOBRE PLATA',
                color:  '#95a5a6',
                rating: 'Cartas 65+ GRL',
                img:    'https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/main/assets/splata.png?raw=true',
                btns: [
                    { label: '🪙 1,000 MONEDAS', bg: '#95a5a6', color: 'black', metodo: 'coins' },
                    { label: '💎 20 JOYAS',       bg: '#0066ff', color: 'white', metodo: 'points' }
                ]
            },
            oro: {
                nombre: 'SOBRE ORO',
                color:  '#f1c40f',
                rating: 'Cartas 75+ GRL',
                img:    'https://github.com/arionkoh-cloud/MPS-ULTIMATE-TEAM-2026/blob/main/assets/soro.png?raw=true',
                btns: [
                    { label: '🪙 5,000 MONEDAS', bg: '#f1c40f', color: 'black', metodo: 'coins' },
                    { label: '💎 100 JOYAS',      bg: '#0066ff', color: 'white', metodo: 'points' }
                ]
            }
        };

        window.abrirModalPack = (tipo) => {
            const info = PACK_INFO[tipo];
            document.getElementById('pack-detail-img').src             = info.img;
            document.getElementById('pack-detail-img').style.objectPosition = 'center';
            document.getElementById('pack-detail-nombre').textContent  = info.nombre;
            document.getElementById('pack-detail-nombre').style.color  = info.color;
            document.getElementById('pack-detail-rating').textContent  = info.rating;

            const btnsEl = document.getElementById('pack-detail-btns');
            btnsEl.innerHTML = info.btns.map(b =>
                `<button class="btn-comprar" style="background:${b.bg}; color:${b.color};"
                    onclick="cerrarModalPack(); abrirPack('${tipo}','${b.metodo}')">${b.label}</button>`
            ).join('');

            document.querySelector('.pack-detail-content').style.borderColor = info.color;
            document.getElementById('pack-detail-modal').style.display = 'flex';
        };

        window.cerrarModalPack = () => {
            document.getElementById('pack-detail-modal').style.display = 'none';
        };

        window.finalizarApertura = () => {
            document.getElementById('reveal-overlay').style.display = 'none';
            if (document.getElementById('club-section').style.display === "block") renderizarClub();
        };
    </script>
</body>
</html>
